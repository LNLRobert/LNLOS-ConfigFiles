speed: 175

[probe]
samples: 1
sample_retract_dist: 2.5

[delayed_gcode _BED_MESH_INIT]
initial_duration: 2.
gcode:
  M117 Loading Default Bedmesh...
  BED_MESH_PROFILE LOAD=default