[bed_mesh]
speed: 175
horizontal_move_z: 12
probe_count: 12,12
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1
fade_end: 10
#fade_target: 0

[screws_tilt_adjust]
