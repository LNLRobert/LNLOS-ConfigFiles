[gcode_macro PID_ALL]
gcode:
    G28
    {% set eTemp = params.EXTRUDERS_TARGET|default(220)|float %}
    {% set bTemp = params.BED_TARGET|default(60)|float %}
    RESPOND TYPE=echo MSG="Starting preheat on extruders and bed"
    M104 T0 S170
    M104 T1 S170
    M140 S50
    RESPOND TYPE=echo MSG="Starting PID on E1"
    PID_CALIBRATE HEATER=extruder TARGET={eTemp}
    RESPOND TYPE=echo MSG="Starting PID on E2"
    PID_CALIBRATE HEATER=extruder1 TARGET={eTemp}
    RESPOND TYPE=echo MSG="Starting PID on Bed"
    PID_CALIBRATE HEATER=heater_bed TARGET={bTemp}
    RESPOND TYPE=echo MSG="All Pids Completed, Saving Config..."
    SET_GCODE_VARIABLE MACRO=LNLOS VARIABLE=has_had_initial_pid VALUE=1
    _SAVE_LNLOS
    SAVE_CONFIG

[gcode_macro PID_EXTRUDERS]
gcode:
    {% set eTemp = params.TARGET|default(220)|float %}
    RESPOND TYPE=echo MSG="Preheating extruders for pid"
    M104 T0 S170
    M104 T1 S170
    RESPOND TYPE=echo MSG="Starting PID on E1"
    PID_CALIBRATE HEATER=extruder TARGET={eTemp}
    RESPOND TYPE=echo MSG="Starting PID on E2"
    PID_CALIBRATE HEATER=extruder1 TARGET={eTemp}
    RESPOND TYPE=echo MSG="Extruders PID complete, saving config..."
    SAVE_CONFIG

[gcode_macro PID_BED]
gcode: 
    {% set bTemp = params.TARGET|default(60)|float %}
    RESPOND TYPE=echo MSG="Starting PID on Bed, Unit will save and restart on completion..."
    PID_CALIBRATE HEATER=heater_bed TARGET={bTemp}
    SAVE_CONFIG