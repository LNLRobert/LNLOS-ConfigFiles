[printer]
kinematics: cartesian
max_velocity: 195
max_accel: 2000
minimum_cruise_ratio: 0.5
max_z_velocity: 10.5
max_z_accel: 500
#max_x_velocity: 250
#max_x_accel: 2500
#max_y_velocity: 200
#max_y_accel: 1500
#max_z_accel: 1000

[idle_timeout] 
timeout: 7200
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Bypassed Timeout
        M117 Bypassed Timeout
    {% else %}
        M118 Timeout Reached
        M117 Timeout Reached
        TURN_OFF_HEATERS
        M84
    {% endif %}

[stepper_x]
microsteps: 32
rotation_distance: 80
homing_speed: 120
homing_positive_dir: false
step_pin: X1_STEP
dir_pin: X1_DIR
enable_pin: !X1_ENABLE
endstop_pin: ^!X1_ENDSTOP


[dual_carriage]
axis: x
microsteps: 32
rotation_distance: 80
homing_speed: 120
safe_distance: 50
step_pin: X2_STEP
dir_pin: X2_DIR
enable_pin: !X2_ENABLE
endstop_pin: ^!X2_ENDSTOP

[stepper_y]
microsteps: 32
rotation_distance: 80
homing_speed: 80
step_pin: Y_STEP
dir_pin: !Y_DIR
enable_pin: !Y_ENABLE
endstop_pin: ^!Y_ENDSTOP

[stepper_z]
microsteps: 32
rotation_distance: 8
homing_speed: 10
step_pin: Z0_STEP
dir_pin: Z0_DIR
enable_pin: !Z0_ENABLE
endstop_pin: ^!Z0_ENDSTOP

[stepper_z1]
microsteps: 32
rotation_distance: 8
step_pin: Z1_STEP
dir_pin: Z1_DIR
enable_pin: !Z1_ENABLE
endstop_pin: ^!Z1_ENDSTOP

[extruder]
sensor_type: ATC Semitec 104NT-4-R025H42G
step_pin: E0_STEP
dir_pin: !E0_DIR
enable_pin: !E0_ENABLE
heater_pin: E0_HEATER
sensor_pin: E0_THERMISTOR

[extruder1]
sensor_type: ATC Semitec 104NT-4-R025H42G
step_pin: E1_STEP
dir_pin: E1_DIR
enable_pin: !E1_ENABLE
heater_pin: E1_HEATER
sensor_pin: E1_THERMISTOR

[heater_bed]
heater_pin: HEATER_BED_PIN
sensor_pin: HEATER_BED_THERMISTOR
min_temp: 0
max_temp: 111
smooth_time: 2.5
sensor_type: EPCOS 100K B57560G104F

[probe]
pin: BREAKOUT_DJ
z_offset: 7.1