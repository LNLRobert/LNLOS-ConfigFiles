############################################################
### BOARD PIN ASSIGNMENTS ###
############################################################

[board_pins]
aliases:
	GEN_ENABLE=PB2

[mcu]
restart_method: command

############################################################
### STEPPER PIN ASSIGNMENTS ###
############################################################

[stepper_x]
step_pin: PC7
dir_pin: !PC6
enable_pin: !GEN_ENABLE
endstop_pin: !PC13

# Definition for the secondary carriage and extruder1
[dual_carriage]
axis: x
step_pin: PA9
dir_pin: !PA8
enable_pin: !GEN_ENABLE
endstop_pin: !PH2

[stepper_y]
step_pin: PB15
dir_pin: PB14
enable_pin: !GEN_ENABLE
endstop_pin: !PC3

[stepper_z]
step_pin: PE13
dir_pin: !PE12
enable_pin: !GEN_ENABLE
endstop_pin: ^!PC15
#endstop_pin: probe:z_virtual_endstop

[stepper_z1]
step_pin: PB13
dir_pin: !PB12
enable_pin: !GEN_ENABLE
#endstop_pin: ^!PC14

############################################################
### EXTRUDER PIN ASSIGNMENTS ###
############################################################

[extruder]
step_pin: PB4
dir_pin: !PB3
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PC1
enable_pin: !GEN_ENABLE
heater_pin: PA5

[extruder1]
step_pin: PB6
dir_pin: PB5
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PC2
enable_pin: !GEN_ENABLE
heater_pin: PA4

############################################################
### HEATER AND FAN PIN ASSIGNMENTS ###
############################################################

[heater_bed]
heater_pin: PE10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
min_temp: 0
max_temp: 110
smooth_time: 2.5


[heater_fan extruder0]
pin: PA0
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater_temp: 80
fan_speed: 1.0
heater: extruder

[heater_fan extruder1]
pin: PE7
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater_temp: 80
fan_speed: 1.0
heater: extruder1

[fan_generic extruder0_partfan]
pin: PA1
max_power: 1.0
shutdown_speed: 0 
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.1
off_below: 0.0
#tachometer_pin:
#tachometer_ppr:
#tachometer_poll_interval:
#enable_pin:

[fan_generic extruder1_partfan]
pin: PE8
max_power: 1.0
shutdown_speed: 0 
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.1
off_below: 0.0
#tachometer_pin:
#tachometer_ppr:
#tachometer_poll_interval:
#enable_pin:


[heater_fan chassis]
pin: PE3
heater: extruder,extruder1
heater_temp: 80.0
fan_speed: 1.0


[gcode_macro M106]
description: sets fan speeds for determined extruders. setting s value gives speed, p param targets extruder
variable_rawSpeed: 0
variable_remapSpeed: 0
gcode:
    {% set rawSpeed = params.S|default(255)|int %}
    {% set remapSpeed = params.S|default(1.0)|int %}
    {% if params.S is defined %}
	{% if rawSpeed|int == 255 %}
		{% set remapSpeed = 1 %}
	{% else %}
		{% if rawSpeed|int == 0 %}
			{% set remapSpeed = 0|int %}
		{% else %}
			{% set remapSpeed = 0.003921*rawSpeed|int %}
		{% endif %}
        {% endif %}
    {% else %}
	{% set ramapSpeed = 0 %}
    {% endif %}
    {% if params.P is defined %}
      {% if params.S is defined %} #set fan speed to max on first extruder
	RESPOND TYPE=echo MSG="106-A"
        SET_FAN_SPEED FAN=extruder{params.P|int}_partfan SPEED={remapSpeed}
      {% else %}  #set fan speed to max on defined extruder
	RESPOND TYPE=echo MSG="106-B"
	SET_FAN_SPEED FAN=extruder{params.P|int}_partfan SPEED=1.0
      {% endif %}
    {% else %}
      {% if params.S is defined %} 
	RESPOND TYPE=echo MSG="106-C"
	SET_FAN_SPEED FAN=extruder0_partfan SPEED={remapSpeed}
      {% else %}
	RESPOND TYPE=echo MSG="106-D"
	SET_FAN_SPEED FAN=extruder0_partfan SPEED=1.0     
      {% endif %}
    {% endif %}

[gcode_macro M107]
gcode:
    {% if params.P is defined %}
	SET_FAN_SPEED FAN=extruder{params.P|int}_partfan SPEED=0      
    {% else %}
	SET_FAN_SPEED FAN=extruder0_partfan SPEED=0  
	SET_FAN_SPEED FAN=extruder1_partfan SPEED=0     
    {% endif %}


############################################################
### PSU PIN ASSIGNMENTS ###
############################################################

#Turn on PSU automatically
[output_pin psu_shutdown]
pin: !PB10
value: 0
shutdown_value: 1