############################################################
### BOARD PIN ASSIGNMENTS ###
############################################################

[board_pins arduino-mega]
aliases:
    ar0=PE0, ar1=PE1, X2_ENDSTOP=PE4, X1_ENDSTOP=PE5, ar4=PG5,
    EXTRUDER_FAN=PE3, ar6=PH3, ar7=PH4, HEATER_BED_PIN=PH5, PART_COOLING_FAN=PH6,
    E1_HEATER=PB4, E0_HEATER=PB5, ar12=PB6, ar13=PB7, Y_ENDSTOP=PJ1,
    BREAKOUT_DJ=PJ0, ar16=PH1, ar17=PH0, Z0_ENDSTOP=PD3, Z1_ENDSTOP=PD2,
    ar20=PD1, ar21=PD0, ar22=PA0, ar23=PA1, E1_ENABLE=PA2,
    ar25=PA3, E1_STEP=PA4, ar27=PA5, E1_DIR=PA6, ar29=PA7,
    X2_ENABLE=PC7, ar31=PC6, ar32=PC5, ar33=PC4, X2_DIR=PC3,
    ar35=PC2, X2_STEP=PC1, ar37=PC0, X1_ENABLE=PD7, ar39=PG2,
    ar40=PG1, ar41=PG0, ar42=PL7, ar43=PL6, ar44=PL5,
    ar45=PL4, Z0_STEP=PL3, ar47=PL2, 0=PL1, ar49=PL0,
    EXTRUDER_FAN0=PB3, EXTRUDER_FAN1=PB2, EXTRUDER_FAN2=PB1, EXTRUDER_FAN3=PB0, X1_STEP=PF0,
    X1_DIR=PF1, Y_ENABLE=PF2, E0_STEP=PF3, E0_DIR=PF4, E0_ENABLE=PF5,
    Y_STEP=PF6, Y_DIR=PF7, Z0_ENABLE=PK0, ar63=PK1, Z1_ENABLE=PK2,
    Z1_STEP=PK3, Z1_DIR=PK4, ar67=PK5, ar68=PK6, ar69=PK7,
    analog0=PF0, analog1=PF1, analog2=PF2, analog3=PF3, analog4=PF4,
    analog5=PF5, analog6=PF6, analog7=PF7, analog8=PK0, analog9=PK1,
    analog10=PK2, analog11=PK3, analog12=PK4, E1_THERMISTOR=PK5, HEATER_BED_THERMISTOR=PK6,
    E0_THERMISTOR=PK7,
    # Marlin adds these additional aliases
    ml70=PG4, ml71=PG3, ml72=PJ2, ml73=PJ3, ml74=PJ7,
    ml75=PJ4, ml76=PJ5, ml77=PJ6, ml78=PE2, ml79=PE6,
    ml80=PE7, ml81=PD4, ml82=PD5, ml83=PD6, ml84=PH2,
    ml85=PH7

[mcu]
restart_method: arduino

############################################################
### STEPPER PIN ASSIGNMENTS ###
############################################################

[stepper_x]
step_pin: X1_STEP
dir_pin: X1_DIR
enable_pin: !X1_ENABLE
endstop_pin: ^!X1_ENDSTOP

# Definition for the secondary carriage and extruder1
[dual_carriage]
axis: x
step_pin: X2_STEP
dir_pin: X2_DIR
enable_pin: !X2_ENABLE
endstop_pin: ^!X2_ENDSTOP

[stepper_y]
step_pin: Y_STEP
dir_pin: !Y_DIR
enable_pin: !Y_ENABLE
endstop_pin: ^!Y_ENDSTOP

[stepper_z]
step_pin: Z0_STEP
dir_pin: Z0_DIR
enable_pin: !Z0_ENABLE
endstop_pin: ^!Z0_ENDSTOP
#endstop_pin: probe:z_virtual_endstop

[stepper_z1]
step_pin: Z1_STEP
dir_pin: Z1_DIR
enable_pin: !Z1_ENABLE
endstop_pin: ^!Z1_ENDSTOP
#endstop_pin: probe:z_virtual_endstop

############################################################
### EXTRUDER PIN ASSIGNMENTS ###
############################################################

[extruder]
step_pin: E0_STEP
dir_pin: !E0_DIR
enable_pin: !E0_ENABLE
heater_pin: E0_HEATER
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: E0_THERMISTOR

[extruder1]
step_pin: E1_STEP
dir_pin: E1_DIR
enable_pin: !E1_ENABLE
heater_pin: E1_HEATER
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: E1_THERMISTOR

############################################################
### PROBE PIN ASSIGNMENTS ###
############################################################



#[bltouch]
#sensor_pin: ^Z0_ENDSTOP
#control_pin: Z1_ENDSTOP

############################################################
### HEATER AND FAN PIN ASSIGNMENTS ###
############################################################

[heater_bed]
heater_pin: HEATER_BED_PIN
sensor_type: EPCOS 100K B57560G104F
sensor_pin: HEATER_BED_THERMISTOR
min_temp: 0
max_temp: 111


[fan]
pin: PART_COOLING_FAN
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0

[heater_fan fan]
pin: EXTRUDER_FAN
heater: extruder,extruder1
heater_temp: 80.0
fan_speed: 0.8
