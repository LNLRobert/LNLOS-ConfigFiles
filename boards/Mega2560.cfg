############################################################
### BOARD PIN ASSIGNMENTS ###
############################################################

[board_pins arduino-mega]
aliases:
    ar0=PE0, ar1=PE1, X2_ENDSTOP=PE4, X1_ENDSTOP=PE5, ar4=PG5,
    ar5=PE3, ar6=PH3, ar7=PH4, ar8=PH5, ar9=PH6,
    ar10=PB4, ar11=PB5, ar12=PB6, ar13=PB7, Y_ENDSTOP=PJ1,
    BREAKOUT_DJ=PJ0, ar16=PH1, ar17=PH0, ar18=PD3, ar19=PD2,
    ar20=PD1, ar21=PD0, ar22=PA0, ar23=PA1, ar24=PA2,
    ar25=PA3, ar26=PA4, ar27=PA5, ar28=PA6, ar29=PA7,
    X2_ENABLE=PC7, ar31=PC6, ar32=PC5, ar33=PC4, X2_DIR=PC3,
    ar35=PC2, X2_STEP=PC1, ar37=PC0, X1_ENABLE=PD7, ar39=PG2,
    ar40=PG1, ar41=PG0, ar42=PL7, ar43=PL6, ar44=PL5,
    ar45=PL4, ar46=PL3, ar47=PL2, ar48=PL1, ar49=PL0,
    ar50=PB3, ar51=PB2, ar52=PB1, ar53=PB0, X1_STEP=PF0,
    X1_DIR=PF1, Y_ENABLE=PF2, ar57=PF3, ar58=PF4, ar59=PF5,
    Y_STEP=PF6, Y_DIR=PF7, ar62=PK0, ar63=PK1, ar64=PK2,
    ar65=PK3, ar66=PK4, ar67=PK5, ar68=PK6, ar69=PK7,
    analog0=PF0, analog1=PF1, analog2=PF2, analog3=PF3, analog4=PF4,
    analog5=PF5, analog6=PF6, analog7=PF7, analog8=PK0, analog9=PK1,
    analog10=PK2, analog11=PK3, analog12=PK4, analog13=PK5, analog14=PK6,
    analog15=PK7,
    # Marlin adds these additional aliases
    ml70=PG4, ml71=PG3, ml72=PJ2, ml73=PJ3, ml74=PJ7,
    ml75=PJ4, ml76=PJ5, ml77=PJ6, ml78=PE2, ml79=PE6,
    ml80=PE7, ml81=PD4, ml82=PD5, ml83=PD6, ml84=PH2,
    ml85=PH7

[mcu]
restart_method: arduino

############################################################
### STEPPER PIN ASSIGNMENTS ###
############################################################

[stepper_x]
step_pin: X1_STEP
dir_pin: X1_DIR
enable_pin: !X1_ENABLE
endstop_pin: ^!X1_ENDSTOP

# Definition for the secondary carriage and extruder1
[dual_carriage]
axis: x
step_pin: X2_STEP
dir_pin: X2_DIR
enable_pin: !X2_ENABLE
endstop_pin: ^!X2_ENDSTOP

[stepper_y]
step_pin: Y_STEP
dir_pin: !Y_DIR
enable_pin: !Y_ENABLE
endstop_pin: ^!Y_ENDSTOP

[stepper_z]
step_pin: ar46
dir_pin: ar48
enable_pin: !ar62
endstop_pin: ^!ar18
#endstop_pin: probe:z_virtual_endstop

[stepper_z1]
step_pin: ar65
dir_pin: ar66
enable_pin: !ar64
endstop_pin: ^!ar19
#endstop_pin: probe:z_virtual_endstop

############################################################
### EXTRUDER PIN ASSIGNMENTS ###
############################################################

[extruder]
step_pin: ar57
dir_pin: !ar58
enable_pin: !ar59
heater_pin: ar11
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: analog15

[extruder1]
step_pin: ar26
dir_pin: ar28
enable_pin: !ar24
heater_pin: ar10
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: analog13

############################################################
### PROBE PIN ASSIGNMENTS ###
############################################################



#[bltouch]
#sensor_pin: ^ar18
#control_pin: ar19

############################################################
### HEATER AND FAN PIN ASSIGNMENTS ###
############################################################

[heater_bed]
heater_pin: ar8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog14
min_temp: 0
max_temp: 111


[fan]
pin: ar9
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0

[heater_fan fan]
pin: ar5
heater: extruder,extruder1
heater_temp: 80.0
fan_speed: 0.8
