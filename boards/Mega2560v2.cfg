############################################################
### HEATER AND FAN PIN ASSIGNMENTS ###
############################################################


[fan]
pin: PART_COOLING_FAN
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0

[heater_fan fan]
pin: EXTRUDER_FAN
heater: extruder,extruder1
heater_temp: 80.0
fan_speed: 0.8
