    ar67=PK5, ar68=PK6, ar69=PK7, ar29=PA7, ar39=PG2, ar6=PH3, ar7=PH4, ar37=PC0, 
    ar40=PG1, ar41=PG0, ar42=PL7, ar43=PL6, ar44=PL5, ar31=PC6, ar32=PC5, ar33=PC4,
    ar45=PL4, ar47=PL2, ar35=PC2, ar25=PA3, ar20=PD1, ar21=PD0, ar22=PA0, ar23=PA1, 
    analog0=PF0, analog1=PF1, analog2=PF2, analog3=PF3, analog4=PF4,
    analog5=PF5, analog6=PF6, analog7=PF7, analog8=PK0, analog9=PK1, ar27=PA5, 
