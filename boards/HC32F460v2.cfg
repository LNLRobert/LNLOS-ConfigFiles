[include HC32F460_Fans.cfg]
############################################################
### BOARD PIN ASSIGNMENTS ###
############################################################

[board_pins]
aliases:
	GEN_ENABLE=!PB2, BREAKOUT_DJ=PA15,
	X2_ENDSTOP=PH2, X1_ENDSTOP=PC13, 
    Z0_ENDSTOP=PC15, Z1_ENDSTOP=PC14, 
    Y_ENDSTOP=PC3, Y_STEP=PB15, Y_DIR=PB14, 
    EXTRUDER_FAN=PE3, 
	HEATER_BED_PIN=PE10, HEATER_BED_THERMISTOR=PC0,
	PART_COOLING_FAN=PH6,
    E1_HEATER=PA4, E0_HEATER=PA5, 
    BREAKOUT_DJ=PJ0, 
    E0_DIR=PB3, E0_STEP=PB4, 
	E1_DIR=PB5, E1_STEP=PB6, 
    X1_DIR=PC6, X1_STEP=PC7, 
    X2_DIR=PA8, X2_STEP=PA9, 
    Z0_DIR=PE12, Z0_STEP=PE13,
    Z1_DIR=PB12, Z1_STEP=PB13, 
    E1_ENABLE=GEN_ENABLE, 
    X2_ENABLE=GEN_ENABLE, 
    X1_ENABLE=GEN_ENABLE,   
	Z0_ENABLE=GEN_ENABLE,
    Z1_ENABLE=GEN_ENABLE, 
    E0_ENABLE=GEN_ENABLE,
    Y_ENABLE=GEN_ENABLE, 
	E1_THERMISTOR=PC2, 
    E0_THERMISTOR=PC1,
    

	ar50=PB3, ar51=PB2, ar52=PB1, ar53=PB0, 

[mcu]
restart_method: command

############################################################
### STEPPER PIN ASSIGNMENTS ###
############################################################

[stepper_x]
step_pin: X1_STEP
dir_pin: !X1_DIR
enable_pin: !GEN_ENABLE
endstop_pin: !X1_ENDSTOP

# Definition for the secondary carriage and extruder1
[dual_carriage]
axis: x
step_pin: X2_STEP
dir_pin: !X2_DIR
enable_pin: !GEN_ENABLE
endstop_pin: !X2_ENDSTOP

[stepper_y]
step_pin: Y_STEP
dir_pin: Y_DIR
enable_pin: !GEN_ENABLE
endstop_pin: !Y_ENDSTOP

[stepper_z]
step_pin: Z0_STEP
dir_pin: !Z0_DIR
enable_pin: !GEN_ENABLE
endstop_pin: ^!Z0_ENDSTOP
#endstop_pin: probe:z_virtual_endstop

[stepper_z1]
step_pin: Z1_STEP
dir_pin: !Z1_DIR
enable_pin: !GEN_ENABLE
endstop_pin: ^!Z1_ENDSTOP

############################################################
### EXTRUDER PIN ASSIGNMENTS ###
############################################################

[extruder]
enable_pin: !GEN_ENABLE
step_pin: E0_STEP
dir_pin: !E0_DIR
sensor_pin: E0_THERMISTOR
heater_pin: E0_HEATER

[extruder1]
enable_pin: !GEN_ENABLE
step_pin: E1_STEP
dir_pin: !E1_DIR
sensor_pin: E1_THERMISTOR
heater_pin: E1_HEATER

############################################################
### HEATER AND FAN PIN ASSIGNMENTS ###
############################################################






############################################################
