#####################################################################
#	Macros
#####################################################################
[include macros/klipper-maintenance-tracker-macro.cfg]
[include macros/idex.cfg]
[include macros/pidutilities.cfg]
[include macros/testspeed.cfg]
[include macros/LoadUnloadFilament.cfg]
[include macros/PrintStartEnd.cfg]
[include scripts/shellmacros.cfg]
[include utilities/LNLOSVariables.cfg]

############################################################
### MACHINE STARTUP ###
############################################################

[delayed_gcode _INITIALIZE]
initial_duration: 1
gcode:
  M117 Initializing...
  LNLOS
  _LOAD_LNLOS
  M117 Ready...

############################################################
### HEATING OVERRIDES ###
############################################################

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set IDEX_MODE = printer["gcode_macro _IDEX_MODE"].idex_mode|default(0)|int %}
    {% set s = params.S|float %}
    {% set t = params.T|default(0)|int %}
    {% if IDEX_MODE == 0 %}
      {% if t == 1 %}   
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={s}
        {% if s != 0 %}
          M117 Waiting For E2 Temperature
          TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={s|float - 1.5} MAXIMUM={s|float + 1.5}
          SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_e2_temp VALUE={s}
        {% endif %}
      {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={s}
        {% if s != 0 %}
            M117 Waiting For E1 Temperature
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s|float - 1.5} MAXIMUM={s|float + 1.5}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_e1_temp VALUE={s}
        {% endif %}
      {% endif %}
    {% else %}
        M104 T0 S{s}
        M104 T1 S{s}
        {% if s != 0 %}
            M117 Waiting For E1 Temperature
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s|float - 1.5} MAXIMUM={s|float + 1.5}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_e1_temp VALUE={s}
            M117 Waiting For E2 Temperature
            TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={s|float - 1.5} MAXIMUM={s|float + 1.5}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_e2_temp VALUE={s}
        {% endif %}
    {% endif %}
    M117


[gcode_macro M104]
rename_existing: M104.1
gcode:
    {% set IDEX_MODE = printer["gcode_macro _IDEX_MODE"].idex_mode|default(0)|int %}
    {% set s = params.S|float %}
    {% set t = params.T|default(0)|int %}
    {% if IDEX_MODE == 0 %}
      {% if t == 1 %}   
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={s}
        {% if s != 0 %}
          SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_e2_temp VALUE={s}
        {% endif %}
      {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={s}
        {% if s != 0 %}
          SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_e1_temp VALUE={s}
        {% endif %}
      {% endif %}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={s}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={s}
        {% if s != 0 %}
          SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_e1_temp VALUE={s}
          SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_e2_temp VALUE={s}
        {% endif %}
    {% endif %}
    M117
    


[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        M117 Waiting For Bed Temperature
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-1.5} MAXIMUM={s+4.5}  ; Wait for bed temp (within 1 degree)
    {% endif %}

############################################################
### PROBE CORE ###
############################################################

### ------------------------------ ###
[gcode_macro _PREP_Z_CALIBRATE]
description: Moves print head to a center of bed location
gcode:
  RESPOND TYPE=echo MSG="Moving Toolhead to position to perform Z calibrations"
  {% set xpos = printer["gcode_macro LNLOS"].z_calibrate_x|float %}
  {% set ypos = printer["gcode_macro LNLOS"].z_calibrate_y|float %}
  {% set zpos = printer["gcode_macro LNLOS"].z_calibrate_zlift|float %}
  HOME_IF_NOT
  G1 Z{zpos} F1050
  G1 X{xpos} Y{ypos} F12000
  RESPOND TYPE=echo MSG="Toolhead in position, ready to calibrate endstop or probe offset"

############################################################
### PROBE SAFETY ###
############################################################

[gcode_macro _CHECK_PROBE_STATUS_PREPRINT]
gcode:
  {% if not printer.probe.last_query %}
    M117 Print Cancelled, probe is installed 
    RESPOND TYPE=error MSG="PROBE IS INSTALLED, CANCELLING PRINT. Please remove probe and restart your print"
    CANCEL_PRINT
  {% else %}
    M117 Probe not installed, resuming print
  {% endif %}

[gcode_macro _HOME_AND_QUERY_PROBE]
gcode:
  M117 Homing all axis and querying probe...
  G28
  QUERY_PROBE

[gcode_macro _HOME_X_AND_QUERY_PROBE]
gcode:
  M117 Homing x and querying probe...
  G28 X
  QUERY_PROBE

############################################################
### BED MESH ###
############################################################

[gcode_macro _bedmesh]
variable_probe_installed: 0
gcode:
  {% if printer["gcode_macro _bedmesh"].probe_installed == 0 %}
	    RESPOND MSG="Install probe and run then command 'probeon'"
	{% else %}
		RESPOND MSG="Measuring bed mesh with TO, with zero x offset "
		HOME_IF_NOT
		T0
		SAVE_GCODE_STATE NAME=bedmesh
		#Always measure with raw left head
		G90
		SET_GCODE_OFFSET X=0 Y=0
		G0 Z10 F6000
		BED_MESH_CALIBRATE
		G0 Y0 Z100
		G28 X
		RESTORE_GCODE_STATE NAME=bedmesh
	{% endif %}

### ------------------------------ ###
[gcode_macro _BED_MESH_LOAD]
description: Load an existing bed calibration mesh for the correct temperature
gcode:
  ##### get target get temperature #####
  {% set bed_temp = printer.heater_bed.target|int %}
  ##### join everything to a single mesh name #####
  {% set mesh_name = "MESH-" + bed_temp|string + "C" %}
  ##### end of definitions #####
  {% if printer.configfile.config["bed_mesh " + mesh_name] is defined %}
    BED_MESH_PROFILE LOAD={mesh_name}
    RESPOND TYPE=echo MSG="Loaded bed mesh profile of {mesh_name} "
  {% else %}
    RESPOND TYPE=error MSG="Did not find a mesh profile of {mesh_name} "
  {% endif %}

### ------------------------------ ###
[gcode_macro _BEDMESH_RENEW]
gcode:
	home_if_not
	{% set dwell = 120000 %}
	{% for t in  [55,60,65,70,75,80,85] %}
    {% set mesh_name = "MESH-" + t|string + "C" %}
		RESPOND MSG="Heating the bed to {t} C"
		M190 S{t}
		RESPOND MSG="Settling for {dwell}ms"
		G4 P{dwell}
		bedmesh
		BED_MESH_PROFILE SAVE={mesh_name}
	{% endfor %}
	SAVE_CONFIG

############################################################
### HOMING AND PARKING ###
############################################################

### ------------------------------ ###
# home unit if not already, if homed will not move any axis
[gcode_macro HOME_IF_NOT]
gcode:
	{% if printer.toolhead.homed_axes != 'xyz' %}
	  G28
  {% endif %}

### ------------------------------ ###
[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
gcode:
  G91
  G0 Z25

############################################################
### GENERAL UTILITY ###
############################################################

### ------------------------------ ###
#moves toolhead to a maintenance position
#todo: improve overall, allow input of specific extruder
[gcode_macro _MAKE_EXTRUDER_ACCESSIBLE]
gcode:
  G28
  G91
  G1 Z+100 F1000
  T0
  G1 X+150 F1750
  #T1
  #G1 X-150 F1750
  G90


[gcode_macro M601]
description: Call Pause if M601 gcode is used 
gcode:
  PAUSE

